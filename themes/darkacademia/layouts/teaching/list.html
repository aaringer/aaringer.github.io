{{ define "main" }}
<section class="page-list">
  <div class="container">
    <header class="list-header">
      <h1 class="page-title">Teaching</h1>
    </header>
    <div class="teaching-list">
      {{ range .Pages.ByDate.Reverse }}
      <article class="teaching-item">
        <h2 class="teaching-title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
        {{ with .Params.summary }}<p class="teaching-summary">{{ . }}</p>{{ end }}
        {{ if .Params.tags }}
        <div class="tag-list">
          {{ range .Params.tags }}<span class="tag">{{ . }}</span>{{ end }}
        </div>
        {{ end }}
        <a href="{{ .RelPermalink }}" class="link-btn">View details →</a>
      </article>
      {{ end }}
    </div>
  </div>
</section>
{{ end }}
