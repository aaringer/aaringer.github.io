<nav class="site-nav" id="site-nav">
  <div class="nav-container">
    <a href="{{ "/" | relURL }}" class="nav-brand">{{ .Site.Title }}</a>
    <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-menu" id="nav-menu" role="menubar">
      {{ range .Site.Menus.main }}
      <li role="none">
        <a href="{{ .URL | absURL }}"
           role="menuitem"
           {{ if or (eq $.RelPermalink (.URL | relURL)) (and $.IsHome (eq .URL "/")) }}aria-current="page"{{ end }}>
          {{ .Name }}
        </a>
      </li>
      {{ end }}
    </ul>
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark/light mode" title="Toggle theme">◐</button>
  </div>
</nav>
