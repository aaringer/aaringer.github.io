{{ define "main" }}
<article class="page-single">
  <div class="container container-narrow">
    <header class="page-header">
      <h1 class="page-title">{{ .Title }}</h1>
      {{ with .Params.summary }}<p class="page-subtitle">{{ . }}</p>{{ end }}
      {{ if .Date }}<p class="page-date">{{ .Date.Format "January 2, 2006" }}</p>{{ end }}
      {{ if .Params.tags }}
      <div class="tag-list">
        {{ range .Params.tags }}<span class="tag">{{ . }}</span>{{ end }}
      </div>
      {{ end }}
    </header>
    <div class="page-content">
      {{ .Content }}
    </div>
    <div class="page-back">
      <a href="{{ .Section | relURL }}" class="back-link">← Back to {{ .Section | title }}</a>
    </div>
  </div>
</article>
{{ end }}
