presentations:

  - title: "Conscientiousness and Exercise Adherence: A Longitudinal Examination"
    author: "Your Name, & Advisor Name"
    year: 2024
    type: "talk"
    venue: "*Annual Convention of the Association for Psychological Science, San Francisco, CA*"
    abstract: "This presentation examined how conscientiousness predicts exercise adherence over a 6-month period in a community sample of 300 adults. Findings suggest that facets of conscientiousness—particularly self-discipline and orderliness—uniquely predict sustained exercise behavior beyond general self-efficacy beliefs."
    tags: [Personality, Health Psychology, Exercise, Longitudinal Study]
