  - title: "Neuroticism Moderates the Stress–Mental Health Relationship: Daily Diary Evidence"
    author: "Your Name, & Collaborator Name"
    year: 2023
    type: "poster"
    venue: "*Society for Personality and Social Psychology Annual Convention, Atlanta, GA*"
    abstract: "Using 30-day daily diary data from 180 adults, we examined whether neuroticism moderates associations between daily stressors and same-day affect. High-neuroticism individuals showed stronger stress reactivity on measures of negative affect and momentary anxiety, even after accounting for perceived social support."
