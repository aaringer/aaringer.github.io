# Configuration of Hugo
# Hugo Documentation: https://gohugo.io/getting-started/configuration/

# Website name
title: Alexa Aringer
copyright: "© {year} Alexandra S. Aringer. All rights reserved."

# Custom theme — no external dependencies
theme: darkacademia

# Website URL
baseURL: https://aaringer.github.io/

############################
## LANGUAGE
############################

defaultContentLanguage: en
hasCJKLanguage: false
defaultContentLanguageInSubdir: false
removePathAccents: true

############################
## SETTINGS
############################

enableGitInfo: false
summaryLength: 30
pagination:
  pagerSize: 1000
enableEmoji: true
enableRobotsTXT: true
ignoreFiles: [\.ipynb$, .ipynb_checkpoints$, \.Rmd$, \.Rmarkdown$, _cache$]
disableAliases: true
outputs:
  home: [HTML, RSS]
  section: [HTML, RSS]
imaging:
  resampleFilter: lanczos
  quality: 80
  anchor: smart
timeout: 600000
markup:
  highlight:
    lineNos: false
    noClasses: false
