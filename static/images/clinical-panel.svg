<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 620" width="420" height="620">
  <defs>
    <linearGradient id="cl-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1818"/>
      <stop offset="48%" stop-color="#131e1c"/>
      <stop offset="100%" stop-color="#0a1410"/>
    </linearGradient>
    <radialGradient id="cl-eye-glow" cx="50%" cy="42%" r="30%">
      <stop offset="0%" stop-color="#b8902a" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#0e1818" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cl-ground" cx="50%" cy="100%" r="55%">
      <stop offset="0%" stop-color="#1a3020" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0a1410" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
