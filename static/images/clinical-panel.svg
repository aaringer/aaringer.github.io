  <line x1="210" y1="316" x2="148" y2="356" stroke="#3d5c35" stroke-width="1.0" opacity="0.58"/>
  <line x1="188" y1="333" x2="168" y2="348" stroke="#3d5c35" stroke-width="0.7" opacity="0.46"/>
  <line x1="176" y1="343" x2="160" y2="344" stroke="#3d5c35" stroke-width="0.7" opacity="0.40"/>
  <line x1="165" y1="353" x2="151" y2="342" stroke="#3d5c35" stroke-width="0.6" opacity="0.38"/>

