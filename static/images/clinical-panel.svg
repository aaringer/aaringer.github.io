  <line x1="232" y1="183" x2="252" y2="168" stroke="#3d5c35" stroke-width="0.7" opacity="0.46"/>
  <line x1="244" y1="173" x2="260" y2="172" stroke="#3d5c35" stroke-width="0.7" opacity="0.40"/>
