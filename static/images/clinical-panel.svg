  <line x1="245" y1="239" x2="233" y2="246" stroke="#b8902a" stroke-width="0.7" opacity="0.52"/>
  <line x1="250" y1="258" x2="236" y2="258" stroke="#b8902a" stroke-width="0.7" opacity="0.52"/>
  <line x1="245" y1="277" x2="233" y2="270" stroke="#b8902a" stroke-width="0.7" opacity="0.52"/>
  <line x1="230" y1="292" x2="221" y2="280" stroke="#b8902a" stroke-width="0.7" opacity="0.52"/>
  <line x1="210" y1="298" x2="210" y2="284" stroke="#b8902a" stroke-width="0.7" opacity="0.52"/>
  <line x1="190" y1="292" x2="199" y2="280" stroke="#b8902a" stroke-width="0.7" opacity="0.52"/>
  <line x1="175" y1="277" x2="187" y2="270" stroke="#b8902a" stroke-width="0.7" opacity="0.52"/>
  <line x1="170" y1="258" x2="184" y2="258" stroke="#b8902a" stroke-width="0.7" opacity="0.52"/>
  <line x1="175" y1="239" x2="187" y2="246" stroke="#b8902a" stroke-width="0.7" opacity="0.52"/>
