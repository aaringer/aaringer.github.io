  <circle cx="108" cy="20"  r="0.8" fill="#e0d0a0" opacity="0.55"/>
  <circle cx="168" cy="46"  r="1.0" fill="#e0d0a0" opacity="0.65"/>
  <circle cx="245" cy="17"  r="0.9" fill="#e0d0a0" opacity="0.58"/>
  <circle cx="308" cy="38"  r="1.2" fill="#e0d0a0" opacity="0.78"/>
  <circle cx="376" cy="25"  r="0.8" fill="#e0d0a0" opacity="0.52"/>
  <circle cx="58"  cy="76"  r="0.7" fill="#e0d0a0" opacity="0.44"/>
  <circle cx="352" cy="64"  r="0.9" fill="#e0d0a0" opacity="0.55"/>
  <circle cx="204" cy="82"  r="0.7" fill="#e0d0a0" opacity="0.40"/>
  <circle cx="132" cy="58"  r="0.6" fill="#e0d0a0" opacity="0.38"/>
  <circle cx="285" cy="70"  r="0.8" fill="#e0d0a0" opacity="0.48"/>
  <circle cx="395" cy="55"  r="0.7" fill="#e0d0a0" opacity="0.42"/>

