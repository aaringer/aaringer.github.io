  <line x1="210" y1="200" x2="148" y2="160" stroke="#3d5c35" stroke-width="1.0" opacity="0.58"/>
  <line x1="188" y1="183" x2="168" y2="168" stroke="#3d5c35" stroke-width="0.7" opacity="0.46"/>
  <line x1="176" y1="173" x2="160" y2="172" stroke="#3d5c35" stroke-width="0.7" opacity="0.40"/>
