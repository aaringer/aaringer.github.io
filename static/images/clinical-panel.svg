  <polygon points="10,562  33,466  56,562"  fill="#0e2016"/>
  <polygon points="118,532 134,436 150,532" fill="#0c1e14"/>
  <polygon points="110,560 134,462 158,560" fill="#0c1e14"/>
  <polygon points="265,530 282,433 299,530" fill="#0c1e14"/>
  <polygon points="256,560 282,460 308,560" fill="#0c1e14"/>
  <polygon points="362,535 378,438 394,535" fill="#0e2016"/>
  <polygon points="354,562 378,466 402,562" fill="#0e2016"/>

