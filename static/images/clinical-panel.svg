  <line x1="210" y1="316" x2="272" y2="356" stroke="#3d5c35" stroke-width="1.0" opacity="0.58"/>
  <line x1="232" y1="333" x2="252" y2="348" stroke="#3d5c35" stroke-width="0.7" opacity="0.46"/>
  <line x1="244" y1="343" x2="260" y2="344" stroke="#3d5c35" stroke-width="0.7" opacity="0.40"/>
  <line x1="255" y1="353" x2="269" y2="342" stroke="#3d5c35" stroke-width="0.6" opacity="0.38"/>

  <!-- ── DECORATIVE RULE + MOTTO ── -->
  <line x1="55"  y1="395" x2="172" y2="395" stroke="#b8902a" stroke-width="0.7" opacity="0.45"/>
  <line x1="248" y1="395" x2="365" y2="395" stroke="#b8902a" stroke-width="0.7" opacity="0.45"/>
  <circle cx="210" cy="395" r="3.2" fill="none" stroke="#b8902a" stroke-width="0.7" opacity="0.50"/>
  <circle cx="210" cy="395" r="1.1" fill="#b8902a" opacity="0.50"/>
  <circle cx="55"  cy="395" r="2"   fill="#b8902a" opacity="0.35"/>
  <circle cx="365" cy="395" r="2"   fill="#b8902a" opacity="0.35"/>

  <text x="210" y="418" text-anchor="middle"
        font-family="Georgia,'Times New Roman',serif"
        font-size="10.5" font-style="italic" letter-spacing="2.5"
        fill="#b8902a" opacity="0.62">mens sana in corpore sano</text>

  <!-- ── PINE TREES ── -->
  <!-- Far layer -->
  <polygon points="62,495  73,432  84,495"  fill="#142818" opacity="0.55"/>
  <polygon points="55,515  73,455  91,515"  fill="#142818" opacity="0.55"/>
  <polygon points="318,492 330,428 342,492" fill="#142818" opacity="0.55"/>
  <polygon points="311,514 330,452 349,514" fill="#142818" opacity="0.55"/>

