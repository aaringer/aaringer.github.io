  <polygon points="-6,588  18,452  42,588"  fill="#071210"/>
  <polygon points="-16,620 18,480  52,620"  fill="#071210"/>
  <polygon points="172,585 198,448 224,585" fill="#071210"/>
  <polygon points="161,620 198,478 235,620" fill="#071210"/>
  <polygon points="386,588 410,452 434,588" fill="#071210"/>
  <polygon points="376,620 410,482 444,620" fill="#071210"/>

  <!-- Ground -->
  <rect x="0" y="598" width="420" height="22" fill="#071210"/>

  <!-- ── ORNATE BORDER ── -->
  <rect x="14" y="14" width="392" height="592" fill="none" stroke="#b8902a" stroke-width="1.5" opacity="0.65"/>
  <rect x="20" y="20" width="380" height="580" fill="none" stroke="#b8902a" stroke-width="0.5" opacity="0.28"/>

  <!-- Corner flourishes -->
  <path d="M14,36 L14,14 L36,14"   fill="none" stroke="#b8902a" stroke-width="1.2" opacity="0.70"/>
  <path d="M384,14 L406,14 L406,36" fill="none" stroke="#b8902a" stroke-width="1.2" opacity="0.70"/>
  <path d="M14,584 L14,606 L36,606" fill="none" stroke="#b8902a" stroke-width="1.2" opacity="0.70"/>
  <path d="M406,584 L406,606 L384,606" fill="none" stroke="#b8902a" stroke-width="1.2" opacity="0.70"/>
</svg>
