<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <style>
      .bg   { fill: #1C1915; }
      .glow { fill: url(#g-dark); }
      .letter { fill: #C9A84C; }
      @media (prefers-color-scheme: light) {
        .bg     { fill: #EDE0CA; }
        .glow   { fill: url(#g-light); }
        .letter { fill: #3D5C35; }
      }
    </style>
    <!-- dark glow: warm ember from center -->
    <radialGradient id="g-dark" cx="50%" cy="38%" r="58%">
      <stop offset="0%"   stop-color="#3A2E1A"/>
      <stop offset="100%" stop-color="#1C1915"/>
    </radialGradient>
    <!-- light glow: soft parchment warmth -->
    <radialGradient id="g-light" cx="50%" cy="38%" r="58%">
      <stop offset="0%"   stop-color="#FAF4E6"/>
      <stop offset="100%" stop-color="#EDE0CA"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" class="bg"/>
  <rect width="512" height="512" rx="96" class="glow" opacity="1"/>

  <!-- Serif "A" monogram -->
  <text
    x="256"
    y="376"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="340"
    font-weight="700"
    class="letter"
    text-anchor="middle"
    dominant-baseline="auto"
    letter-spacing="-6">A</text>
</svg>
